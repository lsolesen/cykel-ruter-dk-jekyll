name: deploy

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  RUBY_VERSION: "3.3"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎 Checkout master
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: ⚡️ Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats build-essential ca-certificates curl make shellcheck pkg-config zlib1g-dev libgsl-dev libffi-dev liblapacke-dev libopenblas-dev minify

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Checking Jekyll configuration
        run: bundle exec jekyll doctor

      - name: 🔨 Build site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --trace --verbose

      - name: Optimize
        run: |
          minify -r -o _site/ --html-keep-document-tags --html-keep-end-tags --html-keep-default-attrvals --html-keep-whitespace --verbose _site

      - name: Cache jekyll
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use cache
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

      - name: 🎉 Deploy to GitHub Pages 🎊
        if: success()
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use cache
        uses: actions/cache@v4
        with:
          path: "_site/"
          key: ${{ runner.os }}-${{ github.sha }}

      - name: ⚡️ Cache HTMLProofer
        id: cache-htmlproofer
        uses: actions/cache@v4
        with:
          path: tmp/.htmlproofer
          key: ${{ runner.os }}-htmlproofer-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-htmlproofer-

      - name: 📉 Check HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: "./_site"
          arguments: |
            --only-4xx
            --assume-extension ".html"
            --ignore-status-codes "400,403,409,429"
            --allow-hash-href
            --ignore-empty-alt